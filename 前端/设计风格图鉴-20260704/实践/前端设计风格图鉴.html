<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端设计风格图鉴 · Design Style Atlas</title>
    <style>
  :root{
    --bg:#0b0b0f; --bg2:#111118; --panel:#15151d; --panel2:#1b1b25;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --ink:#f4f4f7; --ink2:#a8a8b8; --ink3:#6c6c7c;
    --accent:#ff5a3c; --accent2:#ffd166;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{min-height:100vh;
    background:
      radial-gradient(1100px 560px at 88% -8%, rgba(255,90,60,.16), transparent 60%),
      radial-gradient(900px 520px at -6% 4%, rgba(255,209,102,.08), transparent 60%),
      var(--bg);}
  .wrap{max-width:1380px;margin:0 auto;padding:0 28px}
  header.top{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);
    background:linear-gradient(180deg,rgba(11,11,15,.92),rgba(11,11,15,.66));
    border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:20px;padding:14px 0;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:12px;min-width:0}
  .brand .logo{font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
  .brand .logo b{color:var(--accent)}
  .brand .sub{font-size:12px;color:var(--ink3);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:240px}
  .search input{background:transparent;border:0;outline:0;color:var(--ink);font-size:14px;width:100%}
  .search input::placeholder{color:var(--ink3)}
  .search .k{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .controls{padding:22px 0 6px;display:flex;flex-direction:column;gap:18px}
  .hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.04;letter-spacing:-.035em;margin:0 0 14px;font-weight:800}
  .hero h1 em{font-style:normal;color:transparent;background:linear-gradient(92deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text}
  .hero p{color:var(--ink2);font-size:15px;max-width:70ch;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{appearance:none;background:var(--panel);border:1px solid var(--line);color:var(--ink2);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;transition:.18s}
  .chip:hover{border-color:var(--line2);color:var(--ink)}
  .chip.on{background:var(--ink);color:#0b0b0f;border-color:var(--ink)}
  .chip .n{opacity:.5;margin-left:6px;font-variant-numeric:tabular-nums}
  .chip.ghost{background:transparent;border-color:var(--accent);color:var(--accent)}
  .chip.ghost:hover{background:var(--accent);color:#fff}
  .pr-btn{appearance:none;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.18s}
  .pr-btn:hover{filter:brightness(1.08)}
  .guide{max-width:880px}
  .guide nav{position:sticky;top:0;z-index:3;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;padding:14px 28px 12px}
  .guide nav button{appearance:none;background:transparent;border:1px solid var(--line);color:var(--ink2);padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;font-weight:600}
  .guide nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .gsect{padding:26px 28px 30px;display:none}
  .gsect.on{display:block}
  .gsect h3{font-size:18px;letter-spacing:-.02em;margin:0 0 4px;font-weight:800}
  .gsect .lead{color:var(--ink2);font-size:14px;line-height:1.6;margin:0 0 18px;max-width:64ch}
  .ftab{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .ftab th,.ftab td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
  .ftab th{background:var(--panel);color:var(--ink);font-weight:700;font-size:12px}
  .ftab td{color:var(--ink2);line-height:1.5}
  .ftab code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--accent2);font-family:"SF Mono",ui-monospace,monospace}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
  @media(max-width:720px){.steps{grid-template-columns:1fr}}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .step .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-bottom:10px}
  .step h5{margin:0 0 6px;font-size:14px;font-weight:700}
  .step p{margin:0;color:var(--ink2);font-size:12.5px;line-height:1.6}
  .tmpl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .tmpl .th{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .tmpl .th .t{font-weight:700;font-size:13.5px}
  .tmpl .th .t span{color:var(--ink3);font-weight:600;font-size:11px;margin-left:6px}
  .tmpl .th button{appearance:none;background:var(--accent);color:#fff;border:0;border-radius:7px;padding:5px 11px;font-size:11px;font-weight:700;cursor:pointer}
  .tmpl pre{margin:0;padding:13px 14px;overflow:auto;font-size:11.5px;line-height:1.6;color:var(--ink2);font-family:"SF Mono",ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .mixtab td:first-child{font-weight:700;color:var(--ink)}
  .mixtab td:nth-child(3){color:var(--ink3)}
  .pitfall{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .pitfall:last-child{border:0}
  .pitfall .ic{flex-shrink:0;width:24px;height:24px;border-radius:7px;background:rgba(255,90,60,.16);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .pitfall p{margin:0;color:var(--ink2);font-size:13px;line-height:1.55}
  .pitfall p b{color:var(--ink);font-weight:700}
  .swlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
  .swcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}
  .swcard:hover{border-color:var(--line2);transform:translateY(-2px)}
  .swcard .bars{display:flex;height:32px}
  .swcard .bars span{flex:1}
  .swcard .info{padding:8px 10px}
  .swcard .info .nm{font-size:12px;font-weight:700}
  .swcard .info .hx{font-size:9.5px;color:var(--ink3);font-family:"SF Mono",monospace;margin-top:2px}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  .shimmer{background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);background-size:200% 100%;animation:shimmer 3s linear infinite}
  .stats{display:flex;gap:22px;flex-wrap:wrap;color:var(--ink3);font-size:12.5px;align-items:center}
  .stats b{color:var(--ink);font-weight:700}
  .legend{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
  main{padding:26px 0 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(298px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;transition:transform .22s cubic-bezier(.2,.7,.2,1),border-color .22s,box-shadow .22s}
  .card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 24px 60px -28px rgba(0,0,0,.8)}
  .specimen{height:172px;position:relative;overflow:hidden}
  .m-specimen{height:230px;position:relative;overflow:hidden}
  .meta{padding:14px 16px 16px}
  .names{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .names .en{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
  .names .zh{font-size:12.5px;color:var(--ink2)}
  .essence{color:var(--ink2);font-size:12.5px;line-height:1.5;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
  .tag{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);padding:2px 7px;border-radius:6px;letter-spacing:.04em}
  .cat-web{background:rgba(96,165,250,.12);color:#7fb4ff;border-color:transparent}
  .cat-theme{background:rgba(255,90,60,.14);color:#ff8367;border-color:transparent}
  .cat-immersive{background:rgba(168,85,247,.14);color:#c08bff;border-color:transparent}
  .cat-mobile{background:rgba(74,222,128,.14);color:#6df0a0;border-color:transparent}
  .cat-desktop{background:rgba(255,209,102,.14);color:#ffd166;border-color:transparent}
  .cat-compound{background:rgba(20,184,166,.16);color:#2dd4bf;border-color:transparent}
  .swatches{display:flex;gap:0;box-shadow:inset 0 0 0 1px var(--line)}
  .swatches span{flex:1;height:8px}
  .overlay{position:fixed;inset:0;z-index:80;background:rgba(6,6,9,.74);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .2s}
  .overlay.show{display:flex;opacity:1}
  .modal{background:var(--bg2);border:1px solid var(--line2);border-radius:22px;max-width:900px;width:100%;
    max-height:88vh;overflow:auto;box-shadow:0 40px 120px -30px #000}
  .m-body{padding:26px 30px 30px}
  .m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .m-head .t h2{margin:0;font-size:27px;letter-spacing:-.025em;font-weight:800}
  .m-head .t .zh{color:var(--ink2);font-size:15px;margin-top:3px}
  .m-head .era{font-size:12px;color:var(--ink3);border:1px solid var(--line);padding:5px 11px;border-radius:999px;white-space:nowrap}
  .m-head{flex-wrap:wrap}
  .demo-btn{appearance:none;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;transition:.18s;white-space:nowrap;margin-top:4px}
  .demo-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .m-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
  .m-essence{color:var(--ink);font-size:15.5px;line-height:1.6;margin:18px 0 0;max-width:64ch}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px}
  @media(max-width:720px){.m-grid{grid-template-columns:1fr}.m-body{padding:22px}}
  .sect h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 0 12px;font-weight:700}
  .sect ul{margin:0;padding:0;list-style:none}
  .sect li{font-size:13.5px;line-height:1.62;color:var(--ink2);padding:5px 0 5px 20px;position:relative}
  .sect li::before{content:"";position:absolute;left:0;top:12px;width:8px;height:1px;background:var(--accent)}
  .sect code{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--ink);font-family:"SF Mono",ui-monospace,Consolas,monospace;word-break:break-all}
  .pal{display:flex;flex-wrap:wrap;gap:9px}
  .pal .sw{cursor:pointer;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:74px;transition:.15s}
  .pal .sw:hover{transform:translateY(-2px);border-color:var(--line2)}
  .pal .sw .c{height:42px}
  .pal .sw .h{font-size:10px;text-align:center;padding:4px 0;color:var(--ink2);font-family:"SF Mono",ui-monospace,monospace;background:var(--panel)}
  .ex{font-size:13px;color:var(--ink3);line-height:1.6}
  .ex b{color:var(--ink2);font-weight:600}
  .close{position:absolute;top:16px;right:18px;z-index:5;width:34px;height:34px;border-radius:999px;
    background:rgba(0,0,0,.45);border:1px solid var(--line2);color:#fff;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
  .close:hover{background:rgba(0,0,0,.7)}
  .copied{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#0b0b0f;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:.22s;z-index:120}
  .copied.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:var(--ink3);padding:80px 0;font-size:14px}
  footer.foot{border-top:1px solid var(--line);padding:26px 0;color:var(--ink3);font-size:12.5px}
  footer.foot a{color:var(--ink2);border-bottom:1px solid var(--line)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2a2a35;border-radius:8px;border:2px solid var(--bg)}
  ::selection{background:var(--accent);color:#fff}
</style>
  </head>
  <body>
    <header class="top"><div class="wrap top-in">
        <div class="brand"><span
            class="logo">Design&nbsp;Style&nbsp;<b>Atlas</b></span><span
            class="sub">前端设计风格图鉴</span></div>
        <label class="search"><span style="color:var(--ink3)">&#9096;</span>
          <input id="q" placeholder="搜索风格名 / 关键词 / 品牌名…"
            autocomplete="off"><span class="k">/</span></label>
        <button class="pr-btn" onclick="openGuide()">&#9881; 复刻实战</button>
      </div></header>

    <section class="wrap controls">
      <div class="hero">
        <h1>看到好看，叫得出<em>名字</em>，复刻得出来</h1>
        <p>覆盖网页表面风格、氛围主题、沉浸式 / 3D、移动端
          App、桌面软件五大类。每张卡片都是该风格的实拍样本；点开即得配色（点击复制色值）、排版与可直接抄走的复刻要点。</p>
      </div>
      <div class="chips" id="chips"></div>
      <div class="stats" id="stats"></div>
    </section>

    <main class="wrap">
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none">没有匹配的风格。换个关键词试试。</div>
    </main>

    <footer class="foot wrap">
      <span>设计与编撰 · 2026 · 共 <b id="total2">0</b> 种风格。配色点击即复制 hex。配合本地
        <code>D:\Code\.prompt</code> 中的术语大全与 awesome-design-md 公司系统库食用更佳。</span>
    </footer>

    <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
    <div class="overlay" id="goverlay"><div class="modal guide"
        id="gmodal"></div></div>
    <div class="copied" id="copied">已复制</div>

    <script>
const CATS={web:{zh:"网页表面风格",dot:"#60a5fa"},theme:{zh:"氛围主题风格",dot:"#ff5a3c"},immersive:{zh:"沉浸式 / 3D",dot:"#a855f7"},mobile:{zh:"移动端 App",dot:"#4ade80"},desktop:{zh:"桌面软件",dot:"#ffd166"},compound:{zh:"复合风格",dot:"#14b8a6"}};
const STYLES=[
{
 id:'glass', en:'Glassmorphism', zh:'玻璃拟态', cat:'web', era:'2020+', keywords:'毛玻璃 frosted glass backdrop-filter',
 essence:'半透明面板叠在高斯模糊的背景之上，带 1px 高光描边，背后内容若隐若现，呈现磨砂玻璃质感。',
 palette:['#ffffff','#7f5cff','#ff6ec7','#1a1a2e'],
 type:'Inter / SF Pro Text（清晰无衬线，弱字重对比）',
 features:['背景需有彩色色块/图片，否则玻璃无内容可透','面层 fill 用 rgba(255,255,255,.08~.18)，深色用 rgba(255,255,255,.06)','统一描边 1px rgba(255,255,255,.18~.25) 模拟玻璃高光','文字需加细微文字阴影或暗遮罩保证可读性'],
 replicate:['backdrop-filter: blur(20px) saturate(140%); 配 -webkit-backdrop-filter','卡片圆角 16~20px，阴影用多层柔光','Flutter：BackdropFilter + ImageFilter.blur(sigmaX:20)','勿滥用——长列表/表格里用会卡且脏，仅用于弹窗、控制中心、导航栏'],
 examples:'macOS Big Sur 起、iOS 控制中心、Microsoft Fluent Acrylic、Linear 部分浮层、本地 prompt 库《亚克力与液态玻璃效果》。',
 specimen:'<div style="position:absolute;inset:0;background:linear-gradient(120deg,#7f5cff,#ff6ec7 60%,#ffb86c);overflow:hidden"><div style="position:absolute;width:160px;height:160px;border-radius:50%;background:#54f;filter:blur(30px);top:-30px;left:-20px;opacity:.8"></div><div style="position:absolute;width:140px;height:140px;border-radius:50%;background:#ff3d9a;filter:blur(30px);bottom:-30px;right:-10px;opacity:.8"></div><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.25)"><div style="font-size:12px;opacity:.9">毛玻璃面板</div><div style="font-size:10px;opacity:.7;margin-top:4px">Glassmorphism blur(14px)</div></div></div>'
},
{
 id:'neumorphism', en:'Neumorphism', zh:'新拟态 / Soft UI', cat:'web', era:'2019', keywords:'柔和浮雕 soft UI 双向阴影',
 essence:'背景与组件同色，用「亮+暗」双向柔光阴影制造凸起或凹陷，像在软橡皮上压出来的物理按键。',
 palette:['#e0e5ec','#9fa6b8','#4a4f5c','#5a7bff'],
 type:'Quicksand / Nunito（圆润几何无衬线）',
 features:['背景必须接近组件色，否则浮雕消失','凸起：box-shadow 同时给 -6,-6,12 #fff 与 6,6,12 rgba(0,0,0,.12)','凹陷：改用 inset 阴影','圆角偏大（14~20px），交互常为「按下变凹陷」'],
 replicate:['核心：亮阴影 #ffffff + 暗阴影 rgba(163,177,198,.6)','配色限单色系，靠阴影而非颜色区分层级','缺点：可访问性差，按钮与背景对比度低，勿用于需高对比的表单'],
 examples:'UI8 Soft UI Dashboard、Alexander Plyuto 原型、部分智能硬件控制面板。',
 specimen:'<div style="position:absolute;inset:0;background:#e0e5ec;display:flex;align-items:center;justify-content:center;gap:14px"><div style="width:74px;height:74px;border-radius:18px;background:#e0e5ec;box-shadow:-6px -6px 14px #fff,6px 6px 16px rgba(163,177,198,.6);display:flex;align-items:center;justify-content:center;color:#5a7bff;font-size:22px">&#9654;</div><div style="width:74px;height:74px;border-radius:18px;background:#e0e5ec;box-shadow:inset -5px -5px 12px #fff,inset 5px 5px 14px rgba(163,177,198,.55);display:flex;align-items:center;justify-content:center;color:#9fa6b8;font-size:18px">&#9776;</div></div>'
},
{
 id:'claymorphism', en:'Claymorphism', zh:'黏土拟态', cat:'web', era:'2021', keywords:'膨胀黏土 clay puffy 内阴影',
 essence:'大圆角膨胀体 + 彩色柔光 + 明显内阴影高光，像捏出来的彩色橡皮泥，圆润、Q弹、童趣。',
 palette:['#ff6b9d','#ffd166','#6ec1e4','#8b5cf6'],

const grid=document.getElementById('grid'),empty=document.getElementById('empty'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal'),chipsEl=document.getElementById('chips'),statsEl=document.getElementById('stats'),q=document.getElementById('q');
let active='all';
function catClass(c){return 'cat-'+c}
function counts(){const r={all:STYLES.length};for(const s of STYLES)r[s.cat]=(r[s.cat]||0)+1;return r}
function renderChips(){const c=counts();const e=[['all','全部']].concat(Object.keys(CATS).map(k=>[k,CATS[k].zh]));chipsEl.innerHTML=e.map(([k,zh])=>'<button class="chip '+(active===k?'on':'')+'" data-cat="'+k+'">'+zh+'<span class="n">'+(c[k]||0)+'</span></button>').join('');chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderChips();render();});}
function legend(){const c=counts();const sw=Object.entries(CATS).map(([k,v])=>'<span><i style="background:'+v.dot+'"></i>'+v.zh+' '+(c[k]||0)+'</span>').join('');statsEl.innerHTML='<div>共 <b>'+STYLES.length+'</b> 种风格 · 点击任意卡片查看复刻指南</div><div class="legend">'+sw+'</div>';}
function match(s){if(active!=='all'&&s.cat!==active)return false;const t=q.value.trim().toLowerCase();if(!t)return true;const hay=(s.en+' '+s.zh+' '+s.essence+' '+(s.keywords||'')+' '+(s.examples||'')).toLowerCase();return hay.includes(t);}
function card(s){const sw=(s.palette||[]).map(h=>'<span style="background:'+h+'"></span>').join('');return '<article class="card" data-id="'+s.id+'"><div class="specimen">'+s.specimen+'</div><div class="meta"><div class="names"><span class="en">'+s.en+'</span><span class="zh">'+s.zh+'</span></div><p class="essence">'+s.essence+'</p><div class="tags"><span class="tag '+catClass(s.cat)+'">'+CATS[s.cat].zh+'</span>'+(s.era?'<span class="tag">'+s.era+'</span>':'')+'</div><div class="swatches" style="margin-top:12px">'+sw+'</div></div></article>';}
function render(){const list=STYLES.filter(match);grid.innerHTML=list.map(card).join('');empty.style.display=list.length?'none':'block';grid.querySelectorAll('.card').forEach(el=>{const s=STYLES.find(x=>x.id===el.dataset.id);el.onclick=()=>open(s);});}
function pal(s){return '<div class="pal">'+(s.palette||[]).map(h=>'<div class="sw" data-hex="'+h+'"><div class="c" style="background:'+h+'"></div><div class="h">'+h.toUpperCase()+'</div></div>').join('')+'</div>';}
function open(s){const feats=(s.features||[]).map(x=>'<li>'+x+'</li>').join('');const repl=(s.replicate||[]).map(x=>'<li>'+x+'</li>').join('');modal.innerHTML='<button class="close" onclick="closeM()">&#10005;</button><div class="m-specimen">'+s.specimen+'</div><div class="m-body"><div class="m-head"><div class="t"><h2>'+s.en+'</h2><div class="zh">'+s.zh+(s.keywords?' &middot; '+s.keywords:'')+'</div></div><div class="m-actions"><span class="era">'+(s.era||'&mdash;')+'</span><a class="demo-btn" target="_blank" rel="noopener" href="demos/'+s.id+'.html">&#9658; 查看 Demo</a></div></div><p class="m-essence">'+s.essence+'</p><div class="m-grid"><div class="sect"><h4>视觉特征 Visual Features</h4><ul>'+feats+'</ul></div><div class="sect"><h4>如何复刻 How to Replicate</h4><ul>'+repl+'</ul></div><div class="sect"><h4>配色 Palette &middot; 点击复制</h4>'+pal(s)+'<div style="margin-top:12px;font-size:12.5px;color:var(--ink3)">推荐字体：<code>'+(s.type||'&mdash;')+'</code></div></div><div class="sect"><h4>范例与适用 Examples</h4><div class="ex">'+(s.examples||'&mdash;')+'</div><div style="margin-top:14px"><span class="tag '+catClass(s.cat)+'">'+CATS[s.cat].zh+'</span></div></div></div></div>';modal.querySelectorAll('.sw').forEach(el=>el.onclick=()=>copy(el.dataset.hex));overlay.classList.add('show');}
function closeM(){overlay.classList.remove('show');}
overlay.onclick=e=>{if(e.target===overlay)closeM();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}});
const copiedEl=document.getElementById('copied');
function copy(h){navigator.clipboard&&navigator.clipboard.writeText(h);copiedEl.textContent='已复制 '+h.toUpperCase();copiedEl.classList.add('on');clearTimeout(window._t);window._t=setTimeout(()=>copiedEl.classList.remove('on'),1300);}
document.getElementById('total2').textContent=STYLES.length;
q.oninput=render;renderChips();legend();render();

const goverlay=document.getElementById('goverlay'),gmodal=document.getElementById('gmodal');
function openGuide(tab){
 const nav=['five','steps','tmpl','mix','sw','pit'].map(k=>'<button data-g="'+k+'"'+(k===(tab||'five')?' class="on"':'')+'>'+({five:'五要素公式',steps:'复刻三步法',tmpl:'Prompt 模板',mix:'混搭组合',sw:'配色速查',pit:'避坑提醒'}[k])+'</button>').join('');
 const fe=FIVE_ELEMENTS.map(e=>'<tr><td><b>'+e.k+'</b></td><td>'+e.v+'</td></tr>').join('');
 const sp=STEPS.map(s=>'<div class="step"><div class="num">'+s.n+'</div><h5>'+s.t+'</h5><p>'+s.p+'</p></div>').join('');
 const tp=TEMPLATES.map((t,i)=>'<div class="tmpl"><div class="th"><div class="t">'+t.t+'<span>'+t.s+'</span></div><button onclick="copyTmpl('+i+')">复制</button></div><pre>'+t.c.replace(/</g,'&lt;')+'</pre></div>').join('');
 const mx=MIXES.map(m=>'<tr><td>'+m.c+'</td><td>'+m.e+'</td><td>'+m.s+'</td></tr>').join('');
 const sw=SWATCHES.map(w=>'<div class="swcard" onclick="copy(\''+w.a+'\')"><div class="bars"><span style="background:'+w.bg+'"></span><span style="background:'+w.a+'"></span><span style="background:'+w.b+'"></span></div><div class="info"><div class="nm">'+w.n+'</div><div class="hx">'+w.bg+' · '+w.a+'</div></div></div>').join('');
 const pt=PITFALLS.map(p=>'<div class="pitfall"><div class="ic">!</div><p><b>'+p.h+'</b> — '+p.d+'</p></div>').join('');
 gmodal.innerHTML='<button class="close" onclick="closeG()">&#10005;</button><nav>'+nav+'</nav>'+
 '<div class="gsect '+(tab==='five'||!tab?'on':'')+'" id="g-five"><h3>五要素公式 · 读任何页面都能反推</h3><p class="lead">风格本质是这五个变量的固定组合。学会读这五个变量，看到任何好看的页面都能反推出它属于什么风格、怎么复刻。<b>复刻 = 把这五个变量调到目标风格的数值。</b></p><table class="ftab"><tr><th>要素</th><th>常见取值</th></tr>'+fe+'</table></div>'+
 '<div class="gsect '+(tab==='steps'?'on':'')+'" id="g-steps"><h3>复刻三步法 · 从看到到生成</h3><p class="lead">看到喜欢的页面 → 对照速查索引识别风格 → 拆解五要素 → 写 Prompt 喂给 AI。这是 Vibe Coding 的核心工作流。</p><div class="steps">'+sp+'</div></div>'+
 '<div class="gsect '+(tab==='tmpl'?'on':'')+'" id="g-tmpl"><h3>Prompt 模板 · 直接粘贴即用</h3><p class="lead">四套亲测可用的模板，复制后替换方括号内的风格名/参数即可。点「复制」按钮一键取用。</p>'+tp+'</div>'+
 '<div class="gsect '+(tab==='mix'?'on':'')+'" id="g-mix"><h3>混搭黄金组合 · 亲测好看</h3><p class="lead">单一风格容易单调，混搭能产生新意。但记住：主风格不超过 2 种，否则失去辨识度。</p><table class="ftab mixtab"><tr><th>组合</th><th>效果</th><th>适合场景</th></tr>'+mx+'</table></div>'+
 '<div class="gsect '+(tab==='sw'?'on':'')+'" id="g-sw"><h3>配色速查 · 点击复制</h3><p class="lead">常用风格的代表色板，点击卡片复制主色 hex。</p><div class="swlist">'+sw+'</div></div>'+
 '<div class="gsect '+(tab==='pit'?'on':'')+'" id="g-pit"><h3>避坑提醒 · 别踩这些雷</h3><p class="lead">前人踩过的坑，帮你少走弯路。尤其注意可访问性与性能。</p>'+pt+'</div>';
 gmodal.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{gmodal.querySelectorAll('.gsect').forEach(s=>s.classList.remove('on'));document.getElementById('g-'+b.dataset.g).classList.add('on');gmodal.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');gmodal.scrollTop=0;});
 goverlay.classList.add('show');
}
